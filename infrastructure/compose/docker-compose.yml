# Keycloak PoC — single-node stack (ROADMAP Phase 1)
#
# Run from the repository root:
#   docker compose -f infrastructure/compose/docker-compose.yml --env-file .env up -d
# or use infrastructure/scripts/poc.ps1 up
#
# Image tags are pinned here and only here (ROADMAP constraint 1: never `latest`).

name: keycloak-poc

services:
  postgres:
    image: postgres:17.10-alpine
    container_name: kc-poc-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Local mail catcher standing in for M365 SMTP (design.md §2).
  # UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.30.6
    container_name: kc-poc-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP (internal name `mailpit` is what the realm points at)
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    container_name: kc-poc-keycloak
    # `start` (not start-dev) so we exercise the production runtime against
    # Postgres. HTTP + relaxed hostname are the only dev concessions; Phase 7
    # puts TLS and a reverse proxy in front.
    #
    # No --import-realm: that strategy is IGNORE_EXISTING (create-only), so realm
    # edits would never reach an existing realm. The realm-config service below
    # applies keycloak/realms/ idempotently instead.
    command:
      - start
    environment:
      # --- Database (holds realm config, users, persistent sessions) ---
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}

      # --- Bootstrap admin (temporary master-realm account, Phase 7 revisits) ---
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}

      # --- HTTP / hostname (local only) ---
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"

      # --- Management interface: /health/*, /metrics on :9000 (Phase 1 criterion) ---
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

      # --- Logging: JSON is the audit-export path (design.md §2, no listener SPI) ---
      KC_LOG_CONSOLE_OUTPUT: ${KC_LOG_CONSOLE_OUTPUT:-default}
    volumes:
      # The platform's ONLY extension (design.md §5): a pinned, checksum-verified
      # community email-OTP authenticator. Not written by us. Provenance and the
      # evaluation of alternatives are in docs/decision-email-otp-extension.md.
      - ../../keycloak/extensions:/opt/keycloak/providers:ro
    ports:
      - "8080:8080"   # public
      - "9000:9000"   # management (health/metrics)
    depends_on:
      postgres:
        condition: service_healthy
    # The Keycloak image is distroless-ish: no curl/wget. Use bash's /dev/tcp.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  # Spring Boot resource server. Validates bearer JWTs only - no login logic.
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: keycloak-poc/guarantee-gateway-api:0.1.0
    container_name: kc-poc-backend
    environment:
      # Internal URL for key fetching, external URL for issuer validation.
      # See backend SecurityConfig for why these are not the same.
      POC_JWK_SET_URI: http://keycloak:8080/realms/guarantee-gateway/protocol/openid-connect/certs
      POC_ISSUER: http://localhost:8080/realms/guarantee-gateway
      POC_AUDIENCE: guarantee-gateway-api
      POC_CORS_ALLOWED_ORIGINS: http://localhost:4200
      # Business system of record, called per request for facility linkage.
      POC_MARSHALL_URL: http://marshall-mock:8090
    ports:
      - "8081:8081"
    # Deliberately NOT depending on marshall-mock. The API must start and serve
    # identity-only endpoints whether or not the business system is up; a
    # startup dependency would quietly assert the opposite.
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8081/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # Angular SPA, served by nginx. Public client - holds no secret.
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: keycloak-poc/guarantee-gateway-portal:0.1.0
    container_name: kc-poc-frontend
    environment:
      # Browser-facing URLs: these are resolved by the user's browser, not by
      # the container, so they must be the external localhost addresses.
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_REALM: guarantee-gateway
      KEYCLOAK_CLIENT_ID: guarantee-gateway-za
      API_URL: http://localhost:8081
    ports:
      - "4200:4200"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: nginx listens on IPv4 only, while `localhost`
      # inside this image resolves to ::1 first - so the probe was refused and
      # the container sat permanently unhealthy while serving the SPA fine.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4200/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Realm configuration as code (ROADMAP constraint 5).
  # Runs to completion on every `up`, applying keycloak/realms/*.json to the live
  # realm. Idempotent: re-running makes no further changes. This replaces
  # --import-realm, which could only ever create a realm, never update one.
  realm-config:
    image: adorsys/keycloak-config-cli:6.5.1-26
    container_name: kc-poc-realm-config
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - ../../keycloak/realms:/config:ro
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_USER: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KEYCLOAK_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 120s
      IMPORT_FILES_LOCATIONS: /config/*.json
      # Lets the realm file reference secrets as $(env:NAME) instead of
      # hardcoding them in Git - the local stand-in for Key Vault references.
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      # `full` would delete anything absent from the file, including Keycloak's
      # own built-ins and users created by the Marshall mock. Users in particular
      # are NOT config in production - they come from the provisioning feed.
      IMPORT_MANAGED_USER: no-delete
      IMPORT_MANAGED_ROLE: no-delete
      IMPORT_MANAGED_CLIENT_SCOPE: no-delete
      IMPORT_MANAGED_AUTHENTICATION_FLOW: no-delete
      POC_TEST_PASSWORD: ${POC_TEST_PASSWORD}
      MARSHALL_CLIENT_SECRET: ${MARSHALL_CLIENT_SECRET}
    restart: "no"

  # Marshall provisioning mock (ROADMAP Phase 5).
  # Ordinary external service code calling the Admin API - nothing runs inside
  # Keycloak (design.md §4). Waits for realm-config because the service-account
  # client it authenticates as is created by that job.
  marshall-mock:
    build:
      context: ../../marshall-mock
      dockerfile: Dockerfile
    image: keycloak-poc/marshall-mock:0.1.0
    container_name: kc-poc-marshall-mock
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: guarantee-gateway
      KEYCLOAK_CLIENT_ID: marshall-provisioning
      # Least-privilege service account, NOT the master admin. Injected from the
      # environment the way ACA injects a Key Vault secret reference.
      KEYCLOAK_CLIENT_SECRET: ${MARSHALL_CLIENT_SECRET}
      PORT: 8090
    ports:
      - "8090:8090"
    depends_on:
      keycloak:
        condition: service_healthy
      realm-config:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8090/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
    name: keycloak-poc-postgres-data
