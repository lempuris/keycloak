server {
    listen 4200;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime config must never be cached, or a promoted image would keep
    # serving the previous environment's Keycloak URL.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # SPA routing: unknown paths are Angular routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
